# `P5-xx` identifiers are stable validation-record IDs. Each one links a
# test in tests/test_independent_reference_parity.py with its evidence
# record here; renaming them would be churn across both with no benefit.
# They carry no ordering or phase-plan meaning beyond that traceability.
# The committed result files under validation/fea/results/ are named for
# their content instead.
models:
  - model_id: closed_end_tube_stress
    model_version: "3.1.0"
    maturity: verified_equation
    completeness: partial
    evidence:
      - category: independent_equation
        source: validation/non_ring_reference.md
        status: >-
          complete for stress; exact displacement is compared with the
          Boresi and Schmidt Eqs. (11.24) and (11.15) transcription in
          validation/tube_displacement_reference.py at the 1e-9 relative limit.
          Historical membrane references remain unchanged; current comparisons
          select their exact branches. Equilibrium, constitutive, continuity,
          and thin-limit tests are in tests/test_exact_shell_stress.py.
      - category: software_parity
        source: tests/test_tube_stress.py
        status: >-
          underpressure 4.0 manual reproduced for ductile-metal stress and for
          the plastic PVC report sample's maximum hoop stress and shell failure
          pressure; no software oracle selected for displacement, which
          UnderPressure 4.0 does not report
      - category: published_theory
        source: validation/sources/tube_scalar_displacement.md
        status: >-
          Roark/Lame stress equations transcribed in docs/engineering.md; the
          displacement and axial-strain equations, their conventions, surfaces,
          and end-condition assumptions are recorded here, with the former
          membrane branch retained as a historical comparison
      - category: experiment
        source: docs/engineering.md
        status: not required for equation verification
      - category: fea
        source: validation/fea/results/tube_plate_fea_summary.json
        status: >-
          three meshes converged, all checks pass; the executed comparison is
          the stress field, and no displacement comparison has been run
    important_limitations:
      - >-
        Material failure under the category's own criterion only, von Mises
        stress against yield strength for a ductile metal and maximum hoop
        stress against the working or ultimate compressive strength for a
        plastic or brittle material; shell stability and closures are separate.
      - Applies away from the tube/endcap interface.
      - >-
        Radial displacement and axial strain are withheld unless the caller
        supplies an elastic modulus and a Poisson ratio, and the axial length
        change additionally needs a gauge length.
      - >-
        Displacement covers junction effects, local restraint at closures,
        ovalization, instability, plasticity, and ring-frame restraint no more
        than the stress result does; all six are excluded.
      - >-
        The exact displacement equations assume small deformation and linear
        elasticity. Project deformation release screens require maximum
        absolute radial displacement/thickness <= 1 and maximum absolute
        principal strain <= 0.01; exceeding either gives withheld_applicability
        while retaining raw formula values. These are not universal Lamé
        validity limits. Exceeding only the supplied material strength labels raw
        deformation as elastic_estimate_material_limit. Passing this strength
        screen alone does not establish proportional behavior or stability.
      - UnderPressure 4.60 version-stamped captures remain open.
      - Service, material, fabrication, temperature, and inspection inputs remain design-use blockers.

  - model_id: uniformly_loaded_flat_circular_plate
    model_version: "5.0.0"
    maturity: verified_equation
    completeness: partial
    evidence:
      - category: independent_equation
        source: validation/non_ring_reference.md
        status: complete
      - category: software_parity
        source: validation/published/underpressure_example2_flat_plate.md
        status: >-
          underpressure 4.0 manual reproduced, including the Example 2 seat
          failure pressure
      - category: published_theory
        source: tests/test_flat_circular_plate.py
        status: Roark cases 10a/10b transcribed
      - category: experiment
        source: docs/engineering.md
        status: not required for equation verification
      - category: fea
        source: validation/fea/results/plate_sweep_fea_summary.json
        status: >-
          144 solves over seven D_free/t ratios, three Poisson values, and
          both edges, extending the P5-03 plate meshes in
          validation/fea/results/tube_plate_fea_summary.json, including an 18-solve
          deep-mesh sensitivity study at the floor-adjacent and
          estimate-limiting cases; every compared quantity is
          mesh-converged, the bending and shear-corrected center-deflection
          floors hold at every solved Poisson value and no within-budget
          decision changes at the deepest meshes, the fixed-edge
          margin-governing stress is compared through its convergent
          reaction-moment resultant. Corrected-deflection error is measured as
          abs(prediction - FEA) / abs(FEA); its raw 5% floors are D_free/t = 4
          fixed and 6 simply-supported, with the fixed release floor raised to
          10 by the retained bending envelope
    important_limitations:
      - >-
        Fixed and simply-supported ideal boundaries only, each realized as
        restraint of the whole plate edge face; seat compliance is not
        modeled.
      - >-
        Seat response is the average bearing stress on the outside annulus
        only; attachment, seal, penetration, and local-edge response are absent.
      - UnderPressure 4.60 version-stamped captures remain open.
      - >-
        Floors sit on solved ratios; releasing the continuous range above a
        floor relies on the demonstrated monotone decrease of the model-form
        error with thinness. No evidence exists below D_free/t = 4 or outside
        0.05 <= poisson_ratio <= 0.35, so those inputs stay withheld rather
        than extrapolated.
      - >-
        The released deflection and w <= t/2 gate use the shear-corrected
        prediction. It stayed within the 5% numerical comparison budget and
        above the solved deflection over the released solved cases. Neither
        behavior is claimed as a bound between solved points or beyond the
        solved D_free/t range.
      - Service, material, fabrication, temperature, and inspection inputs remain design-use blockers.

  - model_id: roark_nasa_hemispherical_head_external_pressure
    model_version: "5.0.0"
    maturity: verified_equation
    completeness: partial
    evidence:
      - category: independent_equation
        source: validation/non_ring_reference.md
        status: >-
          complete for stress and buckling using the historical reference's
          exact stress branch. Exact spherical displacement is checked against
          the published closed form and radial/tangential strain compatibility;
          validation/hemisphere_displacement_reference.py preserves NASA
          TM-4579 Eq. (5) as a membrane-limit comparator.
      - category: software_parity
        source: validation/published/underpressure_hemisphere_example.md
        status: >-
          underpressure 4.0 manual reproduced for stress; no software oracle
          selected for displacement, which UnderPressure 4.0 does not report
      - category: published_theory
        source: validation/sources/nasa_sp8032_hemisphere_external_pressure.md
        status: >-
          Roark stress and NASA SP-8032 Eqs. 1-4 transcribed; exact spherical
          displacement, its Hooke-law derivation, published closed form,
          membrane limit, and surface conventions are recorded in
          validation/sources/hemisphere_scalar_displacement.md
      - category: experiment
        source: validation/sources/nasa_sp8032_hemisphere_external_pressure.md
        status: NASA lower-bound data only
      - category: fea
        source: docs/engineering.md
        status: not executed
    important_limitations:
      - >-
        Constant-thickness isotropic hemisphere under uniform external
        pressure. The buckling correlation uses a clamped equator; the spherical
        stress and displacement apply away from the equator and do not claim
        that boundary condition.
      - >-
        Buckling capacity is withheld outside the thin-shell and NASA lambda
        gates or without elastic proportional-limit support. Reference-only
        support retains a numerical estimate but cannot pass acceptance.
      - >-
        Junction bending, actual restraint, attachments, penetrations,
        imperfections, residual stress, and plastic interaction are absent;
        the seat is the average bearing stress on the equator annulus only.
      - >-
        Radial displacement assumes small strain and linear elasticity.
        Project deformation release screens require maximum absolute radial
        displacement/thickness <= 1 and maximum absolute principal strain
        <= 0.01; exceeding either gives withheld_applicability with raw formula
        values retained. These are not universal Lamé validity limits.
        Exceeding only the supplied material strength labels it as
        elastic_estimate_material_limit; no post-failure behavior is modeled.
      - >-
        The displacement is the spherical solution away from the equator.
        It is not the equator's radial closure and not a seal-gap estimate, and
        the equator boundary layer, displacement fields, post-buckling
        deformation, and ring-stiffened service displacement are all outside it.
      - UnderPressure 4.60 version-stamped captures remain open.
      - No calibration or physical validation was performed; the result is advisory.

  - model_id: nasa_smooth_cylinder_external_pressure_buckling
    model_version: "5.0.0"
    maturity: verified_equation
    completeness: partial
    evidence:
      - category: independent_equation
        source: validation/non_ring_reference.md
        status: complete
      - category: software_parity
        source: validation/published/underpressure_example4_smooth_buckling.md
        status: >-
          underpressure 4.0 manual reproduced; the kernel's own Roark case-20
          probable-minimum candidate reproduces the four manual Thin Wall
          Buckling displays (Examples 1 and 4 and the report sample) at their
          displayed precision
      - category: published_theory
        source: https://ntrs.nasa.gov/citations/20205011530
        status: NASA Eqs. 19-32 and regimes transcribed
      - category: experiment
        source: https://ntrs.nasa.gov/citations/20205011530
        status: NASA correlation data only
      - category: fea
        source: validation/external_pressure_coverage.md
        status: >-
          no qualifying benchmark; exploratory CalculiX eigenvalue runs showed
          gauge sensitivity, and source review confirmed omitted pressure-load
          stiffness in the selected buckling procedure. A subsequent procedure
          including pressure-load stiffness failed the published ring benchmark,
          so no coverage extension is supported
    important_limitations:
      - The moderate/long factor overlap withholds capacity.
      - Released capacity requires either a source-traceable proportional limit or a
        complete compressive Ramberg-Osgood curve. With only a limit, a correlated
        critical membrane stress above it retains an elastic upper bound with a null margin.
      - >-
        The NASA Eq. 30-32 inelastic correction is implemented for a supplied compressive
        curve. NASA states those factors for lateral pressure and calls the hydrostatic
        biaxial factors unavailable, so the hydrostatic load case uses them as the source
        directs for lack of better information. The bundled Al-6061-T6 LT-extrusion and
        Ti-6Al-4V longitudinal-extrusion shapes are marked reference-only: they retain a
        numerical estimate and may drive exploratory sizing, but cannot pass acceptance.
        A separately reported elastic upper bound may still establish conservative failure
        when it is below demand and the required margin. Neither curve establishes generic
        hoop response across the listed product forms.
      - The R_mid/t > 10 gate is unchanged; the exploratory study did not qualify an extension.
      - End-restraint credit and physical validation are absent.
      - UnderPressure 4.60 version-stamped captures remain open.
      - Imperfection, cycling, environment, temperature, product-form, and fabrication inputs remain design-use blockers.

  - model_id: nasa_ring_stiffened_shell_external_pressure
    model_version: "4.1.0"
    maturity: benchmark_compared
    completeness: partial
    evidence:
      - category: independent_equation
        source: validation/ring_shell_reference.py
        status: complete over m >= 1, n >= 2
      - category: software_parity
        source: validation/ring_shell_investigation.md
        status: DAPS4 cross-check, different theory; no same-equation oracle selected
      - category: published_theory
        source: validation/sources/nasa_sp8007_eq64_eq66_transition.md
        status: Eqs. 64/65 and 82-91 transcribed, Eq. 66 transition open
      - category: experiment
        source: validation/published/dtmb_1324_case17.md
        status: cylinder 4-A at ten bulkhead spacings compared, Southwell estimates; Table 1 closures compared at reconstructed spans
      - category: fea
        source: validation/fea/results/ring_shell_eigenvalue_fea_summary.json
        status: eigenvalue cases executed and converged, pressure-load stiffness omitted, nonlinear open
    important_limitations:
      - Global and inter-ring stability remain advisory.
      - >-
        The saved CalculiX eigenvalues omit distributed-pressure load stiffness;
        their convergence does not validate hydrostatic bifurcation. See
        validation/fea/README.md.
      - A global capacity whose implied membrane stress exceeds the proportional limit, or
        the yield strength when none is supplied, is labelled an elastic upper bound only;
        NASA sanctions no inelastic correction for the smeared orthotropic mode.
      - A complete compressive Ramberg-Osgood curve corrects the inter-ring smooth-shell
        result. The orthotropic global mode remains elastic and advisory; the corrected
        inter-ring pressure can change the advisory governing candidate.
      - Numeric Eq. 64/Eq. 66 transition remains an external blocker.
      - >-
        The mode search excludes axisymmetric hydrostatic instability (n=0),
        reported as not_implemented. It does not govern the DTMB cases; NASA
        TN D-3647 shows it can govern elsewhere. See
        validation/sources/ring_boundary_and_nasa_evidence.md.
      - >-
        The DTMB Table 2 bulkhead supports approximate simple support, with
        rotational restraint from the continuing shell; the predicted lobe
        transition comes earlier than Kendrick's or the observed one. Table 1
        closure comparisons use reconstructed spans.
      - >-
        The ideal Eq. 64 long-cylinder limit is 4/3 of Eq. 66; the 0.75 factor
        cancels that difference in the limit but is not a finite-length selector.
      - Low-lobe accuracy, ring strength and tripping, attachment, fabrication, and interaction remain unresolved.
      - Imperfection, cycling, environment, temperature, product-form, manufacturing-route, and inspection inputs remain design-use blockers.

  - model_id: archimedes_submerged_mass_and_buoyancy
    model_version: "1.0.0"
    maturity: verified_equation
    completeness: partial
    evidence:
      - category: independent_equation
        source: tests/test_hydrostatics.py
        status: >-
          hand-computed masses, net mass, and buoyant force over the positive,
          neutral, and negative cases, in exactly representable binary values
          asserted with ==; no entry in the two reference modules, because
          re-deriving rho*V and rho_f*V*g there would restate the kernel
      - category: software_parity
        source: docs/engineering.md
        status: not applicable, no software oracle selected
      - category: published_theory
        source: docs/engineering.md
        status: Archimedes Props. 6-7 and Lautrup Eqs. (5-5)-(5-8) transcribed
      - category: experiment
        source: docs/engineering.md
        status: not required for equation verification
      - category: fea
        source: docs/engineering.md
        status: not applicable, no stress or deformation field is computed
    important_limitations:
      - Fully submerged, rigid, closed, non-flooded bodies only, at uniform gravity and one uniform fluid density.
      - Both volumes are the caller's resolved undeformed geometry; pressure-deformed volumes are absent.
      - Payloads, penetrators, openings, flooding, and trapped gas are absent.
      - Centre of gravity, centre of buoyancy, stability, and drag are absent.
      - Fluid density and gravity are request inputs; the package states no default and carries no fluid database.

  - model_id: hydrostatic_external_pressure_from_depth
    model_version: "1.0.0"
    maturity: verified_equation
    completeness: partial
    evidence:
      - category: independent_equation
        source: tests/test_hydrostatics.py
        status: >-
          the service and design pressures asserted with == against the literal
          rho*g*h and rho*g*h*factor products at eight depth and factor pairs
          from 0 to 11 km, plus linearity in each of the four inputs by exact
          powers of two, the zero-depth surface boundary, and the evaluation
          order the design pressure depends on; no entry in the two reference
          modules, because re-deriving rho*g*h there would restate the kernel
      - category: software_parity
        source: docs/engineering.md
        status: not applicable, no software oracle selected
      - category: published_theory
        source: docs/engineering.md
        status: Lautrup sec. 4.1 Eqs. (4-3) and (4-4) transcribed
      - category: experiment
        source: docs/engineering.md
        status: not required for equation verification
      - category: fea
        source: docs/engineering.md
        status: not applicable, no stress or deformation field is computed
    important_limitations:
      - Both pressures are differentials across the wall with the interior held at zero gauge; no absolute pressure is formed and internal gas compression is absent.
      - One uniform fluid density under uniform gravity; layered fluids, depth-varying density profiles, and fluid compressibility are absent.
      - Depth is one scalar below the free surface; the vessel's own vertical extent is not resolved.
      - The design factor is the caller's policy multiplier on the service pressure; no source states a value for it.
      - Fluid density and gravity are caller inputs; the package states no default and carries no fluid database.
