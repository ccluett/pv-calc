[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pv-calc"
dynamic = ["version"]
description = "External-pressure vessel calculations for Python and the command line."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Christopher S. Cluett" },
]
keywords = [
  "pressure-vessel",
  "external-pressure",
  "buckling",
  "subsea",
  "structural-analysis",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Manufacturing",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
requires-python = ">=3.11"
# Every floor is installable on every supported Python. PyYAML below 6.0.1
# and pydantic below 2.12 have no 3.14 build, so the lowest-direct resolution
# the package job installs would fail there on the older floors.
dependencies = [
  "pydantic>=2.12",
  # 0.25 first defines the full water-column pressure family
  # (inch_H2O = inH2O, foot_H2O = ftH2O = ft_H2O), which the CLI accepts
  # and the suite pins.
  "pint>=0.25",
  "PyYAML>=6.0.1",
  "typer>=0.16",
]

[project.urls]
Repository = "https://github.com/ccluett/pv-calc"
Documentation = "https://github.com/ccluett/pv-calc/blob/main/docs/engineering.md"
Issues = "https://github.com/ccluett/pv-calc/issues"
Changelog = "https://github.com/ccluett/pv-calc/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pv-calc = "pv_calc.cli:app"

[tool.setuptools.dynamic]
version = { attr = "pv_calc.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["pv_calc*"]

[tool.setuptools.package-data]
pv_calc = ["py.typed"]

# The committed layout is hand-wrapped, so no formatter runs and no
# line-length rule is selected; the selection pins ruff's classic default.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
# The package is fully annotated and ships py.typed, so an unannotated
# addition is a gap, not a choice.
disallow_untyped_defs = true

# PyYAML ships no inline types and the stubs are a separate package this
# package does not depend on; yaml's surface here is one safe_load call.
[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
